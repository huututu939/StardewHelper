android.useAndroidX=true
android.nonTransitiveRClass=true
# c228：daemon 编码必须跟系统 ANSI（GBK）走，不能钉 UTF-8。
#   病根：daemon（UTF-8）给测试执行器 java.exe 写 @argfile，执行器按平台码页（GBK）读 ——
#   项目路径含「星露谷」，UTF-8 字节被读成乱码 ⇒ 类路径项失效 ⇒ 全部单测 ClassNotFound。
#   daemon 用 GBK 后 argfile 两侧同码页；构建脚本/源码由 AGP/Kotlin 插件显式 UTF-8 读取，不受影响。
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=GBK

android.overridePathCheck=true

# c191-b2 构建提速（gradle-build-performance skill，2026-10-31）：
# ⚠ configuration-cache 与 app/build.gradle.kts 的 mergeAssets doLast 守卫不兼容
#   （GradleException：MergeSourceSetFolders 不能序列化脚本对象引用，实测 2026-10-31）。
#   那段守卫是数据管线的安全闸（剔除开发期 assets），不可为提速拆掉 → config-cache 放弃。
#   保留 build-cache 与 parallel 两项，clean+全量构建实测收益见账本 c191-b2 段。
# build-cache：任务输出跨构建复用（clean 后换分支等场景）
org.gradle.caching=true
# parallel：双模块（app/baselineprofile）并行编译
org.gradle.parallel=true
