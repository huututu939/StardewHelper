[versions]
agp = "8.7.3"
kotlin = "2.0.21"
coreKtx = "1.15.0"
activityCompose = "1.9.3"
composeBom = "2024.12.01"
datastore = "1.1.1"
# v2.49.0：与依赖树里的 profileinstaller 1.3.1 同代，稳压 AGP 8.7 / Gradle 8.x 的下限
baselineProfile = "1.3.3"
junit = "4.13.2"
androidxTestExtJunit = "1.2.1"
androidxTestRunner = "1.6.2"
androidxTestRules = "1.6.1"
androidxTestUiAutomator = "2.3.0"
androidxBenchmarkMacro = "1.3.3"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-datastore = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
# v2.86.0：Chrome Custom Tabs（打开 Steam 官方云存档页）。
#   官方库，不是自己写 WebView —— 自绘 WebView 加载登录页是被明令禁止的。
androidx-browser = { group = "androidx.browser", name = "browser", version = "1.8.0" }

# v2.49.0 baseline profile 采集用（只在 :baselineprofile 测试模块里，
# **不会**打进 release APK——com.android.test 模块不参与 app 的打包）
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExtJunit" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }
androidx-test-rules = { group = "androidx.test", name = "rules", version.ref = "androidxTestRules" }
androidx-test-uiautomator = { group = "androidx.test.uiautomator", name = "uiautomator", version.ref = "androidxTestUiAutomator" }
# BaselineProfileRule 来自这里；插件**不会**自动加，必须显式声明。
# 版本与 baselineProfile 插件同代，生成的规则格式才对得上。
androidx-benchmark-macro-junit4 = { group = "androidx.benchmark", name = "benchmark-macro-junit4", version.ref = "androidxBenchmarkMacro" }

# v2.81.0（存档世界状态解析 P0）：JVM 侧的 XmlPullParser 实现。
#
# 为什么需要它：Android 端用 android.util.Xml.newPullParser()，但单元测试跑在
# 普通 JVM 上，mockable android.jar 里的实现会直接抛「Method not mocked」——
# 于是同一份解析代码在测试里根本跑不起来。
# kxml2 自带 org.xmlpull.v1 全套接口与 KXmlParser 实现，接口与 Android 的
# **同源**（同一个 FQN、同一套方法签名），所以解析器只认
# org.xmlpull.v1.XmlPullParser 这一条，两边共用同一份代码。
# ⚠ 只进 testImplementation，**绝不进 APK**。
kxml2 = { group = "net.sf.kxml", name = "kxml2", version = "2.3.0" }

# v2.81.0（P1）：单元测试要读 App 的 JSON（worldItemMap.json / crops.json）。
# Android 端 org.json 在单元测试里是**打桩的**（一调用就抛「Method not mocked」），
# 所以测试侧要挂一个**真的** org.json 实现 —— 接口与 Android 的同名同包，
# 同一份解析代码在真机与单测里都跑得起来。
# ⚠ 只进 testImplementation，**不进 APK**（APK 里的 org.json 是 Android 自带的）。
orgjson = { group = "org.json", name = "json", version = "20240303" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-test = { id = "com.android.test", version.ref = "agp" }
androidx-baselineprofile = { id = "androidx.baselineprofile", version.ref = "baselineProfile" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
